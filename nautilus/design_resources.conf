# Per-design resource sizing for Kubernetes Jobs on NRP Nautilus.
#
# Format: <design>  KEY=VALUE [KEY=VALUE ...]
#   design       -- directory name under designs/gt2n/ (e.g. cirom_dig_ctrl)
#                  or "defaults" for fallback values
#   cpu_req/lim  -- CPU cores
#   mem_req/lim  -- memory (Gi suffix)
#   eph_req/lim  -- ephemeral storage (Gi suffix)

# Nautilus policy: limit/request ratio must be <= 1.2x for both CPU and
# memory (see SOFA-orfs's nautilus/design_resources.conf for the same note).
defaults  cpu_req=5  cpu_lim=6  mem_req=32Gi  mem_lim=38Gi  eph_req=50Gi  eph_lim=60Gi
